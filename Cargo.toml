[package]
name = "mjolnir"
version = "0.1.0"
edition = "2024"
description = "Fast authenticated file transfer: per-chunk AEAD over parallel TCP connections"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
filetime = "0.2.29"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "0.6", features = ["all"] }
tiny_http = "0.12.0"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# Tests move tens of MiB through AES and ChaCha; unoptimized ciphers are slow.
[profile.dev.package."*"]
opt-level = 3
