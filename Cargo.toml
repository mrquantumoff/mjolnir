[package]
name = "mjolnir"
version = "0.2.0"
edition = "2024"
description = "Fast authenticated file transfer and TCP tunnels: per-chunk AEAD over parallel TCP connections"
repository = "https://github.com/mrquantumoff/mjolnir"
license = "BSD-2-Clause"

[features]
default = ["self-update"]
# `mjolnir update`, which replaces the binary with the latest GitHub release.
# Packagers turn it off so the package manager owns the binary.
self-update = []

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
filetime = "0.2.29"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "signal"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zeroize = "1"
# Named only to turn on zeroize-on-drop for the cipher states inside aes-gcm
# and chacha20poly1305.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.9", features = ["zeroize"] }
poly1305 = { version = "0.8", features = ["zeroize"] }
polyval = { version = "0.6", default-features = false, features = ["zeroize"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Tests move tens of MiB through AES and ChaCha; unoptimized ciphers are slow.
[profile.dev.package."*"]
opt-level = 3
