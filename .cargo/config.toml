# Hardware AES and GHASH for AES-256-GCM on 64-bit ARM. The locked aes 0.8
# and polyval 0.6 build their ARMv8 backends only under these cfgs, and then
# pick them at run time: getauxval on Linux, sysctl on macOS. A CPU without
# the Cryptography Extension falls back to the software backend, so the
# binary still runs everywhere.
#
# Windows has no run-time detection in these versions: there the ARMv8 code
# is built but only used when the `aes` target feature is on at compile
# time, which would crash CPUs that lack it, so Windows ARM64 keeps the
# software backend.
#
# CI builds read this file too; its aarch64 Linux job checks that the
# release binary contains AESE and PMULL instructions.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
