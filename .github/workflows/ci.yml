name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs, and the toolchain to
# an exact release, so a moved tag upstream cannot change what builds the
# release binaries. To update one, resolve the new tag with
# `gh api repos/OWNER/REPO/git/ref/tags/TAG` and keep the comment in step.

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux and Windows ARM64 targets cross-compile on x86_64
        # runners, and Intel macOS cross-compiles on the Apple silicon
        # runner. Cross-compiled targets skip their tests since the binaries
        # cannot run on the build host. The Apple silicon build also runs
        # the tests on APFS.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            test: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            test: true
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
            test: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install the AArch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      # What a distribution package builds: no `update` command.
      - name: Check without the self-update feature
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo check --locked --no-default-features --all-targets

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # .cargo/config.toml turns on the ARMv8 AES and GHASH backends; without
      # them the binary holds no AESE or PMULL instruction at all.
      - name: Check for ARMv8 AES and PMULL code
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          aarch64-linux-gnu-objdump -d target/${{ matrix.target }}/release/mjolnir > "$RUNNER_TEMP/disasm"
          aese="$(grep -cw aese "$RUNNER_TEMP/disasm" || true)"
          pmull="$(grep -cw pmull "$RUNNER_TEMP/disasm" || true)"
          echo "aese: $aese, pmull: $pmull"
          [ "$aese" -gt 0 ] && [ "$pmull" -gt 0 ]

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/mjolnir-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" mjolnir \
            -C "$GITHUB_WORKSPACE" README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/mjolnir.exe", README.md, LICENSE `
            -DestinationPath "dist/mjolnir-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mjolnir-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  audit:
    uses: ./.github/workflows/audit.yml

  release:
    name: Release
    # A known-vulnerable dependency stops the release.
    needs: [build, audit]
    # Only a pushed tag publishes. A manual run started on a tag has the same
    # ref, and the README promises that manual runs publish nothing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum mjolnir-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
